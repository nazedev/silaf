<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Server Error – SILAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/theme.js"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gray-900">
    <div class="w-full max-w-lg bg-[#f0f0f0] p-10 brutal-border border-white shadow-[8px_8px_0px_0px_#ffffff] text-center flex flex-col items-center">
        <div class="text-9xl mb-6 flex gap-2">
            <span class="animate-gear origin-center inline-block">⚙️</span>
            <span class="animate-gear origin-center inline-block" style="animation-direction: reverse;">⚙️</span>
        </div>
        <h1 class="text-6xl font-black uppercase text-white bg-red-600 brutal-border px-4 py-2 mb-4">500</h1>
        <h2 class="text-2xl font-black uppercase text-black mb-2 tracking-widest">Sistem Rusak</h2>
        <p class="font-bold text-black mb-8 border-b-[3px] border-black pb-4 uppercase">
            Terjadi kesalahan fatal pada server. Teknisi kami sedang berusaha memperbaikinya.
        </p>
        <button onclick="window.location.reload()" class="inline-block bg-black text-white font-black py-4 px-8 brutal-border border-black shadow-[4px_4px_0px_0px_#ff0000] hover:shadow-none hover:translate-y-1 hover:translate-x-1 uppercase tracking-widest text-lg">
            Coba Muat Ulang
        </button>
        <a href="index.html" class="mt-4 text-black font-bold uppercase hover:underline">
            Atau Kembali ke Beranda
        </a>
    </div>
</body>
</html>
