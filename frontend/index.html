<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SILAF</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/style.css">
    <script src="assets/theme.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white dark:bg-[#1a1a1a] p-8 brutal-border brutal-shadow">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-black bg-primary text-black px-2 inline-block brutal-border uppercase tracking-tighter">SILAF</h1>
            <p class="text-sm font-bold mt-1">Sistem Informasi Lost and Found</p>
        </div>
        <div id="alertBox" class="hidden mb-4 p-3 brutal-border text-sm text-center font-bold"></div>
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-bold mb-1 uppercase tracking-wide">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email"
                    class="brutal-input w-full px-4 py-3">
            </div>
            <div>
                <label class="block text-sm font-bold mb-1 uppercase tracking-wide">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password"
                    class="brutal-input w-full px-4 py-3">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-primary text-black font-black py-3 px-4 brutal-border brutal-shadow hover:brutal-shadow-none uppercase tracking-widest mt-4">
                Masuk
            </button>
        </form>
        <div class="mt-8 flex items-center justify-center">
            <div class="border-t-[3px] border-black dark:border-white flex-grow"></div>
            <span class="px-3 text-sm font-bold uppercase">ATAU</span>
            <div class="border-t-[3px] border-black dark:border-white flex-grow"></div>
        </div>
        <div class="mt-6 flex justify-center w-full" id="googleBtnWrapper">
        </div>
        <p class="mt-8 text-center text-sm font-bold">
            Belum punya akun? <a href="register.html" class="text-primary hover:underline">Daftar sekarang</a>
        </p>
        <p class="mt-4 text-center text-xs font-bold">
            Petugas Keamanan? <a href="admin_login.html" class="underline hover:text-primary">Login Admin</a>
        </p>
    </div>
    <script>
        if (localStorage.getItem('silaf-token')) {
            const user = JSON.parse(localStorage.getItem('silaf-user') || '{}');
            window.location.href = user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
        }
        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('alertBox');
            alertBox.textContent = msg;
            alertBox.className = `mb-4 p-3 brutal-border text-sm text-center font-bold ${isError ? 'bg-red-400 text-black' : 'bg-green-400 text-black'}`;
            alertBox.classList.remove('hidden');
        }
        function handleLoginSuccess(data) {
            localStorage.setItem('silaf-token', data.token);
            localStorage.setItem('silaf-user', JSON.stringify(data.user));
            showAlert('Login berhasil! Mengalihkan...', false);
            setTimeout(() => {
                window.location.href = data.user.role === 'ADMIN' ? 'admin.html' : 'dashboard.html';
            }, 500);
        }
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'MEMPROSES...';
            document.getElementById('alertBox').classList.add('hidden');
            try {
                const res = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    handleLoginSuccess(data);
                } else {
                    showAlert(data.message || 'Login gagal.');
                    btn.disabled = false;
                    btn.textContent = 'MASUK';
                }
            } catch (err) {
                showAlert('Gagal menghubungi server.');
                btn.disabled = false;
                btn.textContent = 'MASUK';
            }
        });
        async function handleGoogleCallback(response) {
            showAlert('Memproses login Google...', false);
            try {
                const res = await fetch('../api/auth/google_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: response.credential })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    handleLoginSuccess(data);
                } else {
                    showAlert(data.message || 'Login Google gagal.');
                }
            } catch (err) {
                showAlert('Gagal menghubungi server.');
            }
        }
        window.addEventListener('load', () => {
            const renderGoogleBtn = () => {
                if (window.google) {
                    google.accounts.id.initialize({
                        client_id: "106663288666-h004jv8jii65vv3kibijoivdr5k3n0tq.apps.googleusercontent.com",
                        callback: handleGoogleCallback,
                        context: "signin",
                        ux_mode: "popup",
                        auto_prompt: false
                    });
                    const submitBtnWidth = document.getElementById('submitBtn').offsetWidth;
                    google.accounts.id.renderButton(
                        document.getElementById("googleBtnWrapper"),
                        { theme: "outline", size: "large", type: "standard", shape: "rectangular", text: "signin_with", logo_alignment: "left", width: submitBtnWidth }
                    );
                } else {
                    setTimeout(renderGoogleBtn, 100);
                }
            };
            renderGoogleBtn();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(() => {
                    if (window.google) {
                        const submitBtnWidth = document.getElementById('submitBtn').offsetWidth;
                        document.getElementById('googleBtnWrapper').innerHTML = '';
                        google.accounts.id.renderButton(
                            document.getElementById("googleBtnWrapper"),
                            { theme: "outline", size: "large", type: "standard", shape: "rectangular", text: "signin_with", logo_alignment: "left", width: submitBtnWidth }
                        );
                    }
                }, 200);
            });
        });
    </script>
</body>
</html>
